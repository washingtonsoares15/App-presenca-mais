name: presencamais
description: Aplicativo de controle de presença universitária.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1  # <-- Para abrir a câmara e ler o QR Code
  geolocator: ^13.0.2     # <-- Para capturar a localização GPS do aluno

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true